<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Contact Form Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        form {
            background: #f5f5f5;
            padding: 30px;
            border-radius: 8px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            margin-top: 20px;
            padding: 12px 24px;
            background: #534741;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #3e332f;
        }
        .info {
            background: #e3f2fd;
            padding: 15px;
            border-left: 4px solid #2196F3;
            margin-bottom: 20px;
        }
        .token-display {
            background: #fff;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
            word-break: break-all;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>🧪 Simple Contact Form Test</h1>

    <div class="info">
        <h3>Purpose</h3>
        <p>This is a minimal test form to diagnose the CSRF token issue.</p>
        <p><strong>It fetches a CSRF token when the page loads and displays it.</strong></p>
    </div>

    <div id="token-status">
        <h3>CSRF Token Status</h3>
        <div id="status">Loading...</div>
        <div id="token-value" class="token-display"></div>
    </div>

    <form action="scripts/backend/send-email.php" method="POST" id="test-form">
        <input type="hidden" name="author" value="eric">
        <input type="hidden" name="csrf_token" id="csrf_token" value="">
        <input type="hidden" name="website" value="">

        <label for="full_name">Full Name:</label>
        <input type="text" name="full_name" id="full_name" value="Test User" required>

        <label for="phone">Phone:</label>
        <input type="tel" name="phone" id="phone" value="(999) 999-9999" required>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" value="eric.henderson@bhcc.edu" required>

        <label for="message">Message:</label>
        <textarea name="message" id="message" required>This is a test message to verify CSRF token functionality.</textarea>

        <button type="submit">Send Test Email</button>
    </form>

    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
    <script>
        $(document).ready(function() {
            console.log('🧪 Test page loaded');

            // Fetch CSRF token immediately
            $.ajax({
                url: 'scripts/backend/get-csrf-token.php',
                method: 'GET',
                dataType: 'json',
                success: function(response) {
                    console.log('✅ CSRF Response:', response);

                    if (response.success && response.token) {
                        $('#csrf_token').val(response.token);
                        $('#status').html('✅ <strong>Token Loaded Successfully</strong>');
                        $('#token-value').text(response.token);
                        console.log('✅ Token populated:', response.token);
                    } else {
                        $('#status').html('❌ <strong>Failed to get token</strong>');
                        $('#token-value').text('ERROR: ' + JSON.stringify(response));
                        console.error('❌ Invalid response:', response);
                    }
                },
                error: function(xhr, status, error) {
                    $('#status').html('❌ <strong>AJAX Error</strong>');
                    $('#token-value').text('Error: ' + error + ' | Status: ' + status);
                    console.error('❌ AJAX Error:', error, status, xhr.responseText);
                }
            });

            // Log form submission
            $('#test-form').on('submit', function() {
                console.log('📤 Form submitting...');
                console.log('CSRF Token value:', $('#csrf_token').val());
                console.log('Author:', $('[name="author"]').val());
                console.log('Email:', $('#email').val());

                if (!$('#csrf_token').val()) {
                    alert('ERROR: CSRF token is empty!');
                    return false;
                }

                return true;
            });
        });
    </script>
</body>
</html>
